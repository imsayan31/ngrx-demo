<div class="dashboard-page">

  <!-- Page Header -->

    <div>
      <h1>HR Dashboard</h1>
      <p>Employee and human resources overview</p>
    </div>

  </div>


  <!-- Statistics -->
  <div class="stats-grid">

    <div class="stat-card">

      <div class="stat-content">
        <span class="stat-label">
          Total Employees
        </span>

        <span class="stat-value">
          --
        </span>
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-content">
        <span class="stat-label">
          Departments
        </span>

        <span class="stat-value">
          --
        </span>
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-content">
        <span class="stat-label">
          New Employees
        </span>

        <span class="stat-value">
          --
        </span>
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-content">
        <span class="stat-label">
          Reports
        </span>

        <span class="stat-value">
          --
        </span>
      </div>

    </div>

  </div>


  <!-- Quick Actions -->

    <div class="card-header">

      <div>
        <h2>HR Management</h2>

        </p>

    </div>


    <div class="quick-actions">

      <a routerLink="/employees" class="action-card">

        <span class="action-title">
          Employees

        <span class="action-description">
          View and manage employees
        </span>

      </a>


      <div class="action-card">

        <span class="action-title">
          Departments
        </span>

        <span class="action-description">
          Manage company departments
        </span>

      </div>


      <div class="action-card">

        <span class="action-title">
          Reports
