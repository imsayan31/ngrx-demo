<h2>Add Employee</h2>

<form [formGroup]="employeeForm" (ngSubmit)="createEmployee()">
  <div>
    <label>Name</label>
    <input type="text" formControlName="name">
  </div>

  <div>
    <label>Department</label>
    <input type="text" formControlName="department">
  </div>

  <div>
    <label>Salary</label>
    <input type="number" formControlName="salary">
  </div>

  <button type="submit">{{ editingEmployeeId ? 'Edit' : 'Add' }} Employee</button>
</form>

<table>
  <thead>
  <tr>
    <th>Name</th>
    <th>Department</th>
    <th>Salary</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
    @for (employee of employees; track $index) {
      <tr>
        <td>{{ employee.name }}</td>
        <td>{{ employee.dept }}</td>
        <td>{{ employee.salary }}</td>
        <td>
          <button type="button" (click)="editEmployee(employee)">Edit</button>
          |
          <button type="button" (click)="deleteEmployee(employee.id)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
<div class="pagination">
  <button type="button" (click)="previousPage()" [disabled]="currentPage === 0">Previous</button>
  <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
  <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">Next</button>
</div>
