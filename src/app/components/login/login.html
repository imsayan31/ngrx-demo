<div class="login-container">
  <h2>Log In</h2>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="username">
        Username
      </label>
      <input
        id="username"
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Enter username"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">
        Password
      </label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        required
      />
    </div>

    <button type="submit">
      Login
    </button>

  </form>

  @if (message) {
    <p>{{ message }}</p>
  }

</div>
