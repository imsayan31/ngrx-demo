<div class="login-page">

  <div class="login-container">

    <!-- Branding -->
    <div class="login-brand">

      <div class="brand-icon">
        EMS
      </div>

      <h1>Employee Management</h1>

      <p>System</p>

    </div>


    <!-- Login Card -->
    <div class="login-card">

      <div class="login-header">

        <h2>Welcome Back</h2>

        <p>
          Sign in to continue to your account
        </p>

      </div>


      <form (ngSubmit)="login()">

        <!-- Username -->
        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />

        </div>


        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

        </div>


        <!-- Login Button -->
        <button
          type="submit"
          class="login-button">

          Sign In

        </button>

      </form>


      <!-- Message -->
      @if (message) {

        <div class="login-message">
          {{ message }}
        </div>

      }

    </div>


    <!-- Footer -->
    <div class="login-footer">

      Employee Management System

    </div>

  </div>

</div>
